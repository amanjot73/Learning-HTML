<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    <style>
        body{
            background-color: rgb(236, 236, 236);
        }
        #hello{
            background-color: aqua;
        }
        #bye{
            background-color: aqua;
        }
        
    </style>
</head>
<body>
    <H1 id = "hello">My lists</H1>
    <h2>Unordered List</h2>
    <ul style="list-style-type: square;">
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
    </ul>
    <h2>Ordered List</h2>
    <ol>
        <li>One</li>
        <li>Two</li>
        <li>Three</li>
    </ol>
    <h2>Data List</h2>
    <dl>
        <dt>Khalsa</dt> dt is data title/topic
        <dd>Pure Form</dd> dd is data description
    </dl>
    <span id="bye">Hello
    </span>
</body>
</html>
