<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            width: 100%;
            text-align: center;
            border-collapse: collapse;
            background-color: #414141;
            
        }
        th{
            color: white;
        }
        td{
            color: chartreuse;
        }
        th , td{
            padding: 10px;
            border: 1px solid black;
            
        }
        /* tr{
            background-color: #fff;
        } */
        #Hello{
            background-color: rgb(194, 28, 28);
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Country</th>
            <th>Code</th>
            <th>Pin</th>
        </tr>
        <tr>
            <td>Khalistan</td>
            <td>1313</td>
            <td>1984</td>
        </tr>
        <tr>
            <td>India</td>
            <td>1111</td>
            <td>1947</td>
        </tr>
        <tr>
            <td>USA</td>
            <td>1010</td>
            <td>8542</td>
        </tr>
    </table>
    <!-- <br> -->
    <table>
        <tr>
            <th>Items</th>
            <th>Expenditure</th>
            
        </tr>
        <tr>
            <td>Donuts</td>
            <td>20000</td>
        </tr>
        <tr>
            <td>Pizza</td>
            <td>10000</td>
        </tr>
        <tr id="Hello">
            <td>Total</td>
            <td>30000</td>
        </tr>
    </table>
    
    
</body>
</html>
